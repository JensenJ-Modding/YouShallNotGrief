plugins {
    id 'com.github.johnrengelman.shadow'
}

repositories {
    maven { url = 'https://maven.tterrag.com/' }
    maven {url = "https://api.modrinth.com/maven"}
    maven {
        name = "Modmaven"
        url = uri("https://modmaven.dev/")

        content {
            includeGroup("appeng")
        }
    }
}

dependencies {
    // SQLite Driver
    modImplementation "maven.modrinth:sqlite-jdbc:${sqlite_version}"
    include "maven.modrinth:sqlite-jdbc:${sqlite_version}"

    //Dependencies for testing
    modImplementation "com.simibubi.create:create-${minecraft_version}:${create_version}:slim" transitive false
    modImplementation "com.jozufozu.flywheel:flywheel-forge-${minecraft_version}:${flywheel_version}"
    modImplementation "com.tterrag.registrate:Registrate:${registrate_version}"
    modImplementation "appeng:appliedenergistics2-forge:${ae2_version}"
}

apply from: 'https://raw.githubusercontent.com/JensenJ-Modding/Mod-Resources/refs/heads/main/1.20.1/Gradle/forge-build.gradle'
