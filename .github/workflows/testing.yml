name: Testing

on:
  push:
    branches:
      - "1.20.1"
  pull_request:

env:
  JAVA_VERSION: 17

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build the mod
        run: gradle build

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: |
            common/build/libs/
            fabric/build/libs/
            forge/build/libs/

  test-launch:
    strategy:
      fail-fast: false
      matrix:
        loader: [forge, fabric]
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: Artifacts

      - name: Setup Environment Variables
        run: |
          echo "MOD_VERSION=$(grep '^mod_version =' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> "$GITHUB_ENV"
          echo "MINECRAFT_VERSION=$(grep '^minecraft_version =' gradle.properties | cut -d'=' -f2 | tr -d ' ')" >> "$GITHUB_ENV"
          echo "FABRIC_API_VERSION=$(grep '^fabric_api_version =' gradle.properties | cut -d'=' -f2 | tr -d ' ' | sed 's/+.*//')" >> "$GITHUB_ENV"

      - name: Move built mod into run/mods
        run: |
          mkdir -p run/mods
          cp ${{ matrix.loader }}/build/libs/youshallnotgrief-${{ env.MINECRAFT_VERSION }}-${{ matrix.loader }}-${{ env.MOD_VERSION }}.jar run/mods

      # Lock to a specific commit, incase of breaking changes
      - name: Run the MC client
        uses: 3arthqu4ke/mc-runtime-test@077c3b731692cc531233c711688ea14a6f4a6622
        with:
          mc: ${{ env.MINECRAFT_VERSION }}
          modloader: ${{ matrix.loader }}
          regex: .*${{ matrix.loader }}.*
          mc-runtime-test: none
          java: ${{ env.JAVA_VERSION }}
          fabric-api: ${{ matrix.loader == 'fabric' && env.FABRIC_API_VERSION || 'none' }}
