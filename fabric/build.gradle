plugins {
    id 'com.gradleup.shadow'
}

repositories {
    maven { url = "https://mvn.devos.one/snapshots/" }
    maven { url = "https://mvn.devos.one/releases/" }
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" }
    maven { url = "https://jitpack.io/" }
    maven {url = "https://api.modrinth.com/maven"}
}

dependencies {
    // SQLite Driver
    modImplementation(include("maven.modrinth:minecraft-sqlite-jdbc:${sqlite_version}"))
}

apply from: 'https://raw.githubusercontent.com/JensenJ-Modding/Mod-Resources/refs/heads/main/1.21.1/Gradle/fabric-build.gradle'